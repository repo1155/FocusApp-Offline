name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # The Replit export has a stale workspace lockfile. Reconcile it so
        # the Expo project can install consistently in Actions.
        run: pnpm install --no-frozen-lockfile

      - name: Type-check the FocusApp workspace
        run: pnpm --filter @workspace/focusapp-offline run typecheck

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        working-directory: artifacts/focusapp-offline
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK and AAB
        working-directory: artifacts/focusapp-offline/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: focusapp-android-builds
          path: |
            artifacts/focusapp-offline/android/app/build/outputs/apk/release/*.apk
            artifacts/focusapp-offline/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
